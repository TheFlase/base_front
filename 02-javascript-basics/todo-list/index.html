<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待办事项列表</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="todo-app">
            <!-- 头部 -->
            <header class="header">
                <h1>📝 我的待办事项</h1>
                <p class="subtitle">高效管理你的每一天</p>
            </header>

            <!-- 输入区域 -->
            <div class="input-section">
                <input 
                    type="text" 
                    id="todoInput" 
                    class="todo-input" 
                    placeholder="添加新的待办事项..."
                    autocomplete="off"
                >
                <button id="addBtn" class="btn-add">
                    <span class="btn-text">添加</span>
                    <span class="btn-icon">+</span>
                </button>
            </div>

            <!-- 统计信息 -->
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-number" id="totalCount">0</span>
                    <span class="stat-label">全部</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="activeCount">0</span>
                    <span class="stat-label">活动</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="completedCount">0</span>
                    <span class="stat-label">已完成</span>
                </div>
            </div>

            <!-- 过滤按钮 -->
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">全部</button>
                <button class="filter-btn" data-filter="active">活动</button>
                <button class="filter-btn" data-filter="completed">已完成</button>
            </div>

            <!-- 待办事项列表 -->
            <ul id="todoList" class="todo-list"></ul>

            <!-- 空状态提示 -->
            <div id="emptyState" class="empty-state">
                <div class="empty-icon">✨</div>
                <p>还没有待办事项</p>
                <p class="empty-hint">添加一个新的待办事项开始吧！</p>
            </div>

            <!-- 底部操作 -->
            <div class="footer-actions">
                <button id="clearCompletedBtn" class="btn-clear">
                    清除已完成
                </button>
                <button id="clearAllBtn" class="btn-clear-all">
                    清空全部
                </button>
            </div>
        </div>

        <!-- 功能说明 -->
        <div class="features">
            <h3>✨ 功能特性</h3>
            <ul>
                <li>✅ 添加、编辑、删除待办事项</li>
                <li>✅ 标记完成/未完成状态</li>
                <li>✅ 按状态过滤显示</li>
                <li>✅ 本地存储，刷新不丢失</li>
                <li>✅ 实时统计数据</li>
                <li>✅ 支持键盘快捷键（Enter添加）</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
